<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <title>Moraya Land Surveyors</title>
    <link rel="icon" type="image/png" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Apply theme + language before first paint (prevents flash). Keep in sync with ThemeProvider.
      (function () {
        try {
          var t = localStorage.getItem('moraya.theme');
          if (t !== 'light' && t !== 'dark') t = 'system';
          var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          var r = document.documentElement;
          r.classList.toggle('dark', dark);
          r.style.colorScheme = dark ? 'dark' : 'light';
          if (localStorage.getItem('moraya.lang') === 'mr') r.lang = 'mr';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', dark ? '#111111' : '#ffffff');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Moraya needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
